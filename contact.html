<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="navContact">Contact — SmartLife Hub</title>
  <meta name="description" content="Contact SmartLife Hub — questions, support, or partnership inquiries.">
  <link rel="canonical" href="https://smartlifehub.com/contact.html">
  <link rel="stylesheet" href="assets/css/style.css">
  <meta property="og:title" content="Contact — SmartLife Hub">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://smartlifehub.com/contact.html">
  <script src="assets/js/i18n.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</head>
<body>
  <header class="header">
    <div class="container">
      <nav class="nav">
        <button class="mobile-menu-btn" aria-label="Menu" aria-expanded="false">☰</button>
        <div class="nav-brand">
          <a href="index.html"><span>Smart</span>Life Hub</a>
        </div>
        <div class="lang-switch">
          <button class="lang-btn active" data-lang="en">EN</button>
          <button class="lang-btn" data-lang="fr">FR</button>
          <button class="lang-btn" data-lang="ar">AR</button>
        </div>
        <ul class="nav-links">
          <li><a href="apps/index.html" data-i18n="navApps">Apps</a></li>
          <li><a href="blog/index.html" data-i18n="navBlog">Blog</a></li>
          <li><a href="about.html" data-i18n="navAbout">About</a></li>
          <li><a href="contact.html" data-i18n="navContact">Contact</a></li>
          <li><a href="privacy.html" data-i18n="navPrivacy">Privacy</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <div class="card" style="max-width: 600px; margin: 0 auto;">
        <h2 data-i18n="contact">Contact</h2>
        <p data-i18n="contactText">Questions or partnership inquiries? Get in touch.</p>
        <form style="margin-top: 1.5rem;">
          <div style="margin-bottom: 1rem;">
            <label style="display: block; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.3rem;">Your name</label>
            <input type="text" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 6px; font-family: inherit;">
          </div>
          <div style="margin-bottom: 1rem;">
            <label style="display: block; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.3rem;">Email address</label>
            <input type="email" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 6px; font-family: inherit;">
          </div>
          <div style="margin-bottom: 1rem;">
            <label style="display: block; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.3rem;">Message</label>
            <textarea style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; min-height: 120px;"></textarea>
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
        </form>
        <p style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
          Or email us directly: <strong>heroalfa36@gmail.com</strong>
        </p>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">
      <div class="footer-bottom">
        <span data-i18n="footerRights">© 2026 SmartLife Hub. All rights reserved.</span>
      </div>
    </div>
  </footer>
</body>
</html>
