<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="blogTitle">Blog — SmartLife Innovations</title>
  <meta name="description" content="SmartLife Innovations blog — practical guides on food waste, kitchen organization, productivity and digital life.">
  <link rel="canonical" href="https://smartlifeinnovations.com/blog/">
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="../assets/js/i18n.js" defer></script>
  <script src="../assets/js/main.js" defer></script>
  <style>
    .blog-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-bottom: 2rem;
    }
    .cat-filter {
      background: transparent;
      color: var(--text-muted);
      border: 2px solid var(--border);
      padding: 0.5rem 1rem;
      border-radius: 25px;
      cursor: pointer;
      font-size: 0.9rem;
      font-family: inherit;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }
    .cat-filter:hover {
      border-color: var(--dark-green);
      color: var(--dark-green);
    }
    .cat-filter.active {
      background: var(--dark-green);
      color: var(--white);
      border-color: var(--dark-green);
    }
    .blog-card h3 a {
      color: inherit;
      text-decoration: none;
    }
    .blog-card-media {
      display: block;
      overflow: hidden;
    }
    .blog-card-media img {
      transition: transform 0.3s ease;
    }
    .blog-card:hover .blog-card-media img {
      transform: scale(1.05);
    }
    .blog-status {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container">
      <nav class="nav">
        <button class="mobile-menu-btn" aria-label="Menu" aria-expanded="false">☰</button>
        <div class="nav-brand"><a href="../index.html"><span>Smart</span>Life Innovations</a></div>
        <div class="lang-switch">
          <button class="lang-btn active" data-lang="en">EN</button>
          <button class="lang-btn" data-lang="fr">FR</button>
          <button class="lang-btn" data-lang="ar">AR</button>
        </div>
        <ul class="nav-links">
          <li><a href="../index.html" data-i18n="navApps">Apps</a></li>
          <li><a href="index.html" data-i18n="navBlog">Blog</a></li>
          <li><a href="../about.html" data-i18n="navAbout">About</a></li>
          <li><a href="../contact.html" data-i18n="navContact">Contact</a></li>
          <li><a href="../privacy.html" data-i18n="navPrivacy">Privacy</a></li>
          <li><a href="../admin.html" style="background:var(--dark-green);color:var(--white);padding:0.4rem 0.8rem;border-radius:6px;font-size:0.85rem;">Admin</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <div class="section-header">
        <h2 data-i18n="blogTitle">Latest Articles</h2>
        <p data-i18n="blogSub">Practical guides on food waste, kitchen organization, productivity and digital life.</p>
      </div>

      <div class="blog-filters" role="group" aria-label="Filter articles by category">
        <button class="cat-filter active" data-filter="all" aria-pressed="true">All</button>
        <button class="cat-filter" data-filter="smart-kitchen" aria-pressed="false">Smart Kitchen</button>
        <button class="cat-filter" data-filter="digital-life" aria-pressed="false">Digital Life</button>
        <button class="cat-filter" data-filter="privacy-security" aria-pressed="false">Privacy &amp; Security</button>
        <button class="cat-filter" data-filter="news" aria-pressed="false">News</button>
      </div>

      <div id="blogGrid" class="blog-grid" aria-live="polite">
        <p class="blog-status">Loading articles…</p>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">
      <div class="footer-bottom">
        <span data-i18n="footerRights">© 2026 SmartLife Innovations. All rights reserved.</span>
      </div>
    </div>
  </footer>

  <script>
    (function () {
      'use strict';

      var grid = document.getElementById('blogGrid');
      var filterButtons = Array.prototype.slice.call(document.querySelectorAll('.cat-filter'));
      var posts = [];
      var activeFilter = 'all';

      function formatDate(value) {
        var d = new Date(value);
        if (!value || isNaN(d.getTime())) return '';
        return d.toLocaleDateString('en-US', {
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        });
      }

      function articleUrl(slug) {
        return 'post.html?slug=' + encodeURIComponent(slug);
      }

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function render(filter) {
        activeFilter = filter || 'all';

        var visible = activeFilter === 'all'
          ? posts
          : posts.filter(function (post) {
              return String(post.category).toLowerCase() === activeFilter;
            });

        if (!visible.length) {
          grid.innerHTML = '<p class="blog-status">No articles found in this category yet.<br><small>Try another category.</small></p>';
          return;
        }

        grid.innerHTML = visible.map(function (post) {
          var url = articleUrl(post.slug);
          var title = escapeHtml(post.title);
          var excerpt = escapeHtml(post.excerpt);
          var image = escapeHtml(post.image || '');
          var category = escapeHtml(post.categoryLabel || post.category || '');
          var readTime = escapeHtml(post.readTime || '');
          var date = escapeHtml(formatDate(post.date));

          return '' +
            '<article class="blog-card">' +
              '<a class="blog-card-media" href="' + url + '" tabindex="-1" aria-hidden="true">' +
                '<img src="' + image + '" alt="' + title + '" loading="lazy">' +
              '</a>' +
              '<div class="blog-content">' +
                '<div class="blog-meta">' +
                  '<span style="color:var(--dark-green);font-weight:600;">' + category + '</span>' +
                  (readTime ? '<span>' + readTime + '</span>' : '') +
                  (date ? '<span>' + date + '</span>' : '') +
                '</div>' +
                '<h3><a href="' + url + '">' + title + '</a></h3>' +
                '<p>' + excerpt + '</p>' +
                '<a class="read-more" href="' + url + '">Read more &rarr;</a>' +
              '</div>' +
            '</article>';
        }).join('');
      }

      function setActiveButton(filter) {
        filterButtons.forEach(function (button) {
          var isActive = button.getAttribute('data-filter') === filter;
          button.classList.toggle('active', isActive);
          button.setAttribute('aria-pressed', isActive ? 'true' : 'false');
        });
      }

      filterButtons.forEach(function (button) {
        button.addEventListener('click', function () {
          var filter = button.getAttribute('data-filter');
          setActiveButton(filter);
          render(filter);
        });
      });

      fetch('../_data/blog.json', { cache: 'no-store' })
        .then(function (response) {
          if (!response.ok) {
            throw new Error('HTTP ' + response.status + ' while loading blog.json');
          }
          return response.json();
        })
        .then(function (data) {
          posts = Array.isArray(data.posts) ? data.posts : [];
          render('all');
        })
        .catch(function (error) {
          console.error('Unable to load blog data:', error);
          grid.innerHTML = '<p class="blog-status">Unable to load articles. Please check the data file.</p>';
        });
    })();
  </script>
</body>
</html>
