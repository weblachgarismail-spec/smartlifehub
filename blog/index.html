<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="blogTitle">Blog — SmartLife Innovations</title>
  <meta name="description" content="SmartLife Innovations blog — practical guides on food waste, kitchen organization, productivity and digital life.">
  <link rel="canonical" href="https://smartlifeinnovations.com/blog/">
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="../assets/js/i18n.js" defer></script>
  <script src="../assets/js/main.js" defer></script>
  <!-- Blog data: 17 posts (11 EN + 4 FR + 2 News) with images, categories, and read times -->
  <script src="../_data/blog.json" id="blog-data" defer></script>
</head>
<body>
  <header class="header">
    <div class="container">
      <nav class="nav">
        <button class="mobile-menu-btn" aria-label="Menu" aria-expanded="false">☰</button>
        <div class="nav-brand"><a href="../index.html"><span>Smart</span>Life Innovations</a></div>
        <div class="lang-switch">
          <button class="lang-btn active" data-lang="en">EN</button>
          <button class="lang-btn" data-lang="fr">FR</button>
          <button class="lang-btn" data-lang="ar">AR</button>
        </div>
        <ul class="nav-links">
          <li><a href="../index.html" data-i18n="navApps">Apps</a></li>
          <li><a href="index.html" data-i18n="navBlog">Blog</a></li>
          <li><a href="../about.html" data-i18n="navAbout">About</a></li>
          <li><a href="../contact.html" data-i18n="navContact">Contact</a></li>
          <li><a href="../privacy.html" data-i18n="navPrivacy">Privacy</a></li>
          <li><a href="../admin.html" style="background:var(--dark-green);color:var(--white);padding:0.4rem 0.8rem;border-radius:6px;font-size:0.85rem;">Admin</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <div class="section-header">
        <h2 data-i18n="blogTitle">Latest Articles</h2>
        <p data-i18n="blogSub">Practical guides on food waste, kitchen organization, productivity and digital life.</p>
      </div>

      <!-- Category filters -->
      <div style="display:flex; gap:0.5rem; margin-bottom:2rem; flex-wrap:wrap; justify-content:center;">
        <button class="cat-filter active" data-filter="all" style="background:var(--dark-green);color:var(--white);border:none;padding:0.5rem 1rem;border-radius:25px;cursor:font-size:0.9rem;">All</button>
        <button class="cat-filter" data-filter="smart-kitchen" style="background:transparent;border:2px solid var(--border);padding:0.5rem 1rem;border-radius:25px;cursor:pointer;font-size:0.9rem;">Smart Kitchen</button>
        <button class="cat-filter" data-filter="digital-life" style="background:transparent;border:2px solid var(--border);padding:0.5rem 1rem;border-radius:25px;cursor:pointer;font-size:0.9rem;">Digital Life</button>
        <button class="cat-filter" data-filter="privacy-security" style="background:transparent;border:2px solid var(--border);padding:0.5rem 1rem;border-radius:25px;cursor:pointer;font-size:0.9rem;">Privacy & Security</button>
        <button class="cat-filter" data-filter="news" style="background:transparent;border:2px solid var(--border);padding:0.5rem 1rem;border-radius:25px;cursor:pointer;font-size:0.9rem;">News</button>
      </div>

      <div id="blogGrid" class="blog-grid">
        <!-- Posts will be injected here by JavaScript -->
      </div>
    </div>
  </section>

  <footer>
    <div class="container">
      <div class="footer-bottom">
        <span data-i18n="footerRights">© 2026 SmartLife Innovations. All rights reserved.</span>
      </div>
    </div>
  </footer>

  <script>
    // ============================================
    // Blog Index — Manual Implementation
    // Handles category filtering and article rendering
    // ============================================

    document.addEventListener('DOMContentLoaded', () => {
      // Wait for blog data to load
      const blogDataElement = document.getElementById('blog-data');
      if (!blogDataElement) {
        console.error('blog-data element not found');
        return;
      }

      let blogData = null;
      try {
        blogData = JSON.parse(blogDataElement.textContent || blogDataElement.innerText || '');
      } catch (e) {
        console.error('Failed to parse blog-data JSON:', e);
        document.getElementById('blogGrid').innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:2rem;">Unable to load articles. Please check the data file.</p>';
        return;
      }

      const grid = document.getElementById('blogGrid');
      const filterBtns = document.querySelectorAll('.cat-filter');
      let activeFilter = 'all';

      // Render articles based on filter
      function renderArticles(filter) {
        const posts = blogData.posts || [];

        // Filter posts by category
        const filteredPosts = filter === 'all'
          ? posts
          : posts.filter(post => post.category === filter);

        // Clear grid
        grid.innerHTML = '';

        // If no posts match filter show message
        if (filteredPosts.length === 0) {
          grid.innerHTML = `
            <div style="text-align:center; padding:3rem; color:var(--text-muted);">
              <p>Aucun article trouvé pour cette catégorie.</p>
              <p style="font-size:0.9rem; margin-top:1rem;">Veuillez sélectionner une autre catégorie.</p>
            </div>
          `;
          return;
        }

        // Render each post
        filteredPosts.forEach(post => {
          const article = document.createElement('article');
          article.className = 'blog-card';

          // Format the date nicely
          const dateObj = new Date(post.date);
          const formattedDate = dateObj.toLocaleDateString('en-US', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
          });

          article.innerHTML = `
            <a href="blog-${post.slug}.html" style="text-decoration:none; color:inherit; display:block;">
              <div class="blog-image" style="width:100%; height:200px; background:var(--cream-dark); overflow:hidden; position:relative;">
                <img src="${post.image}" alt="${post.title}" style="width:100%; height:100%; object-fit:cover; transition: transform 0.3s ease;">
              </div>
              <div class="blog-content" style="padding:1.5rem;">
                <div class="blog-meta" style="font-size:0.85rem; color:var(--text-muted); margin-bottom:0.5rem; display:flex; justify-content:space-between; align-items:center;">
                  <span class="blog-category" style="color:var(--dark-green);">${post.categoryLabel}</span>
                  <span class="blog-readtime">${post.readTime}</span>
                  <span class="blog-date">${formattedDate}</span>
                </div>
                <h3 class="blog-title" style="font-size:1.2rem; color:var(--dark-green); font-weight:600; margin:0.5rem 0; line-height:1.3;">
                  ${post.title}
                </h3>
                <p class="blog-excerpt" style="color:var(--text-muted); font-size:0.9rem; margin:0.5rem 0; line-height:1.4; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;">
                  ${post.excerpt}
                </p>
                <a href="blog-${post.slug}.html" class="read-more-link" style="display:inline-flex; align-items:center; gap:0.5rem; font-weight:600; font-size:0.9rem; color:var(--sage-dark); margin-top:0.5rem; text-decoration:none;">
                  Read more →
                </a>
              </div>
            </a>
          `;
          grid.appendChild(article);
        });
      }

      // Initialize with all articles
      renderArticles('all');

      // Category filter functionality
      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          // Remove active class from all buttons
          filterBtns.forEach(b => {
            b.classList.remove('active');
            b.style.background = 'transparent';
            b.style.color = 'var(--text-muted)';
            b.style.borderColor = 'var(--border)';
          });

          // Add active class to clicked button
          btn.classList.add('active');
          btn.style.background = 'var(--dark-green)';
          btn.style.color = 'var(--white)';
          btn.style.borderColor = 'var(--dark-green)';

          // Get the filter value
          const filterValue = btn.getAttribute('data-filter');

          // Render articles with the selected filter
          renderArticles(filterValue);

          // Update active filter variable
          activeFilter = filterValue;
        });
      });

      // Optional: Add hover effect to article images
      const articleImages = grid.querySelectorAll('.blog-image img');
      articleImages.forEach(img => {
        img.addEventListener('mouseenter', () => {
          img.style.transform = 'scale(1.05)';
          img.style.transition = 'transform 0.3s ease';
        });
        img.addEventListener('mouseleave', () => {
          img.style.transform = 'scale(1)';
        });
      });
    });
  </script>
</body>
</html>
