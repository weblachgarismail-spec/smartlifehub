<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article — SmartLife Innovations</title>
  <meta name="description" content="Read practical guides on food waste, kitchen organization, productivity and digital life from SmartLife Innovations.">
  <link rel="canonical" href="https://smartlifeinnovations.com/blog/">
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="../assets/js/i18n.js" defer></script>
  <script src="../assets/js/main.js" defer></script>
  <style>
    .article-wrap {
      max-width: 760px;
      margin: 0 auto;
    }
    .article-back {
      display: inline-block;
      margin-bottom: 1.5rem;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--sage-dark);
    }
    .article-header h1 {
      color: var(--dark-green);
      font-size: 2rem;
      line-height: 1.25;
      margin-bottom: 0.75rem;
    }
    .article-header .article-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    .article-cover {
      width: 100%;
      max-height: 420px;
      object-fit: cover;
      border-radius: var(--radius);
      margin-bottom: 2rem;
      background: var(--cream-dark);
    }
    .article-body {
      color: var(--text);
      font-size: 1.05rem;
      line-height: 1.8;
    }
    .article-body h2 {
      color: var(--dark-green);
      font-size: 1.4rem;
      margin: 2rem 0 0.75rem;
    }
    .article-body h3 {
      color: var(--dark-green);
      font-size: 1.15rem;
      margin: 1.5rem 0 0.5rem;
    }
    .article-body p {
      margin-bottom: 1rem;
    }
    .article-body ul,
    .article-body ol {
      margin: 0 0 1rem 1.5rem;
    }
    .article-body li {
      margin-bottom: 0.4rem;
    }
    .article-body strong {
      color: var(--dark-green);
    }
    .article-status {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container">
      <nav class="nav">
        <button class="mobile-menu-btn" aria-label="Menu" aria-expanded="false">☰</button>
        <div class="nav-brand"><a href="../index.html"><span>Smart</span>Life Innovations</a></div>
        <div class="lang-switch">
          <button class="lang-btn active" data-lang="en">EN</button>
          <button class="lang-btn" data-lang="fr">FR</button>
          <button class="lang-btn" data-lang="ar">AR</button>
        </div>
        <ul class="nav-links">
          <li><a href="../index.html" data-i18n="navApps">Apps</a></li>
          <li><a href="index.html" data-i18n="navBlog">Blog</a></li>
          <li><a href="../about.html" data-i18n="navAbout">About</a></li>
          <li><a href="../contact.html" data-i18n="navContact">Contact</a></li>
          <li><a href="../privacy.html" data-i18n="navPrivacy">Privacy</a></li>
          <li><a href="../admin.html" style="background:var(--dark-green);color:var(--white);padding:0.4rem 0.8rem;border-radius:6px;font-size:0.85rem;">Admin</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <div id="postRoot" class="article-wrap">
        <p class="article-status">Loading article…</p>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">
      <div class="footer-bottom">
        <span data-i18n="footerRights">© 2026 SmartLife Innovations. All rights reserved.</span>
      </div>
    </div>
  </footer>

  <script>
    (function () {
      'use strict';

      var root = document.getElementById('postRoot');
      var slug = new URLSearchParams(window.location.search).get('slug');

      function formatDate(value) {
        var d = new Date(value);
        if (!value || isNaN(d.getTime())) return '';
        return d.toLocaleDateString('en-US', {
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        });
      }

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function showMessage(message) {
        root.innerHTML =
          '<p class="article-status">' + message + '</p>' +
          '<p style="text-align:center;"><a class="article-back" href="index.html">&larr; Back to all articles</a></p>';
      }

      if (!slug) {
        showMessage('No article was selected.');
        return;
      }

      fetch('../_data/blog.json', { cache: 'no-store' })
        .then(function (response) {
          if (!response.ok) {
            throw new Error('HTTP ' + response.status + ' while loading blog.json');
          }
          return response.json();
        })
        .then(function (data) {
          var posts = Array.isArray(data.posts) ? data.posts : [];
          var post = posts.filter(function (item) {
            return item.slug === slug;
          })[0];

          if (!post) {
            showMessage('This article could not be found.');
            return;
          }

          document.title = post.title + ' — SmartLife Innovations';

          var meta = document.querySelector('meta[name="description"]');
          if (meta && post.excerpt) meta.setAttribute('content', post.excerpt);

          var category = escapeHtml(post.categoryLabel || post.category || '');
          var readTime = escapeHtml(post.readTime || '');
          var date = escapeHtml(formatDate(post.date));
          var cover = post.image
            ? '<img class="article-cover" src="' + escapeHtml(post.image) + '" alt="' + escapeHtml(post.title) + '">'
            : '';

          root.innerHTML = '' +
            '<a class="article-back" href="index.html">&larr; Back to all articles</a>' +
            '<article>' +
              '<header class="article-header">' +
                '<h1>' + escapeHtml(post.title) + '</h1>' +
                '<div class="article-meta">' +
                  (category ? '<span style="color:var(--dark-green);font-weight:600;">' + category + '</span>' : '') +
                  (date ? '<span>' + date + '</span>' : '') +
                  (readTime ? '<span>' + readTime + '</span>' : '') +
                '</div>' +
              '</header>' +
              cover +
              '<div class="article-body">' + (post.content || '<p>' + escapeHtml(post.excerpt || '') + '</p>') + '</div>' +
            '</article>';
        })
        .catch(function (error) {
          console.error('Unable to load article:', error);
          showMessage('Unable to load this article. Please try again later.');
        });
    })();
  </script>
</body>
</html>
